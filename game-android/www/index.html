<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code Mobile Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ide-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>EXPLORER</span>
                <button class="add-btn" onclick="createNewFile()">+</button>
            </div>
            <div class="file-tree" id="fileTree"></div>
        </div>
        <div class="main-content">
            <div class="top-bar">
                <div class="tabs-container" id="tabsContainer"></div>
                <button class="run-btn" onclick="togglePreview()">▶ Запуск</button>
            </div>
            <div class="editor-wrapper">
                <textarea id="codeEditor" spellcheck="false" placeholder="// Твій код тут..."></textarea>
                <div class="preview-container" id="previewContainer">
                    <div class="preview-header">
                        <span>Прів'ю результату</span>
                        <button class="close-preview" onclick="togglePreview()">×</button>
                    </div>
                    <iframe id="previewFrame"></iframe>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
